# OpenShift Sandboxed Containers Operator
#
# This installs the operator that manages Kata Containers on OCP.
# After the operator is running, apply kata-runtimeclass.yaml to
# trigger Kata installation on worker nodes.
# Reference: https://docs.openshift.com/container-platform/latest/sandboxed_containers/
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-agent-sandbox
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: agent-sandbox-operatorgroup
  namespace: openshift-agent-sandbox
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: agent-sandbox-operator
  namespace: openshift-agent-sandbox
spec:
  channel: preview-0.9
  name: agent-sandbox-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
