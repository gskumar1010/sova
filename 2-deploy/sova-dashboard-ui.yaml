apiVersion: v1
kind: ServiceAccount
metadata:
  name: sova-dashboard-ui
  labels:
    app.kubernetes.io/part-of: openshell-kata
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sova-dashboard-ui
  labels:
    app.kubernetes.io/name: sova-dashboard-ui
    app.kubernetes.io/part-of: openshell-kata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sova-dashboard-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sova-dashboard-ui
        app.kubernetes.io/part-of: openshell-kata
    spec:
      serviceAccountName: sova-dashboard-ui
      containers:
        - name: ui
          image: REGISTRY_PLACEHOLDER/sova-dashboard-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: SANDBOX_NAME
              value: opencode-dual
            # The openshell CLI (baked into this image) connects directly to the
            # gateway using this endpoint; the gateway then execs into the Kata
            # sandbox. The gateway runs plaintext (disableTls) and allows
            # unauthenticated users, so no client certs are required.
            - name: OPENSHELL_GATEWAY_ENDPOINT
              value: http://openshell-kata:8080
            # Vulnerability scanning can take several minutes for large repos;
            # give exec generous timeout headroom.
            - name: OPENSHELL_EXEC_TIMEOUT
              value: "600"
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sova-dashboard-ui
  labels:
    app.kubernetes.io/name: sova-dashboard-ui
    app.kubernetes.io/part-of: openshell-kata
spec:
  selector:
    app.kubernetes.io/name: sova-dashboard-ui
  ports:
    - name: http
      port: 8501
      targetPort: 8501
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sova-dashboard-ui
  labels:
    app.kubernetes.io/name: sova-dashboard-ui
    app.kubernetes.io/part-of: openshell-kata
spec:
  to:
    kind: Service
    name: sova-dashboard-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
