apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-orchestrator-api
  labels:
    app.kubernetes.io/name: vuln-orchestrator-api
    app.kubernetes.io/part-of: openshell-kata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vuln-orchestrator-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vuln-orchestrator-api
        app.kubernetes.io/part-of: openshell-kata
    spec:
      containers:
        - name: api
          image: REGISTRY_PLACEHOLDER/vuln-orchestrator-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          # Volume mounts for persistent scan data
          volumeMounts:
            - name: scan-data
              mountPath: /tmp/sova_sarif
            - name: scan-db
              mountPath: /tmp
      volumes:
        - name: scan-data
          emptyDir: {}
        - name: scan-db
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-orchestrator-api
  labels:
    app.kubernetes.io/name: vuln-orchestrator-api
    app.kubernetes.io/part-of: openshell-kata
spec:
  selector:
    app.kubernetes.io/name: vuln-orchestrator-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
