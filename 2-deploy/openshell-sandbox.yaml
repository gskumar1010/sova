# OpenShellSandbox CRD - Defines the agent sandbox with policy and provider refs
# This replaces the CLI-based "openshell sandbox create" command
apiVersion: openshell.lenshq.io/v1alpha1
kind: OpenShellSandbox
metadata:
  name: opencode-dual
  namespace: NAMESPACE_PLACEHOLDER
spec:
  # Reference to the policy (hot-reloadable for network/provider sections)
  policyRef: vuln-agent-policy

  # Reference to credential providers (array of provider names)
  providers:
    - opencode-model-provider

  # Container image for the sandbox
  image: REGISTRY_PLACEHOLDER/openshell-kata-agent-sandbox:latest

  # Runtime class for Kata Containers
  runtimeClassName: kata

  # Environment variables (non-secret) - map of key-value pairs
  # Note: Including OPENAI_API_KEY directly due to gateway credential binding mode
  environment:
    OPENAI_BASE_URL: "MODEL_ENDPOINT_PLACEHOLDER/v1"
    OPENAI_API_KEY: "API_KEY_PLACEHOLDER"
    OPENCODE_DISABLE_MODELS_FETCH: "1"
    OPENCODE_DISABLE_AUTOUPDATE: "1"
    OPENCODE_PURE: "1"
    OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
    OPENCODE_DISABLE_AUTOCOMPACT: "1"
    OPENCODE_DB: ":memory:"
    OPENCODE_CONFIG_CONTENT: 'OPENCODE_CFG_PLACEHOLDER'

  # Log level
  logLevel: info

  # Labels for the sandbox pod
  labels:
    app: vuln-agent
    component: sandbox

  # Annotations for the sandbox pod
  annotations:
    description: "Vulnerability scanning agent with dual protection (OpenShell + Kata)"
