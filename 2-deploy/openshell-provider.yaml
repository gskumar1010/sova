# OpenShellProvider - Manages credentials for the sandbox
# This binds the API key secret to the sandbox via the OpenShell gateway
apiVersion: openshell.lenshq.io/v1alpha1
kind: OpenShellProvider
metadata:
  name: opencode-model-provider
  namespace: NAMESPACE_PLACEHOLDER
spec:
  # Gateway workspace this provider belongs to
  workspace: default

  # Provider type - this maps to the OpenCode config provider
  type: openai-compatible

  # Explicitly set credential mode to inject as environment variables
  credentialMode: Static

  # Reference to the secret containing OPENAI_API_KEY and OPENAI_BASE_URL
  credentialsSecretRef:
    name: opencode-api-keys
    keys:
      - OPENAI_API_KEY
      - OPENAI_BASE_URL

  # Configuration merged with the sandbox environment
  config:
    baseURL: "MODEL_ENDPOINT_PLACEHOLDER/v1"
