# OpenShell sandbox network and filesystem policy
#
# Allows ONLY the configured model endpoint. All other egress is denied.
# The MODEL_ENDPOINT placeholder is substituted by setup.sh at deploy time.

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /etc]
  read_write: [/sandbox, /tmp, /home, /opt, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  model_inference:
    name: model-inference
    endpoints:
      - host: MODEL_ENDPOINT_HOST
        port: MODEL_ENDPOINT_PORT
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      # The OpenCode agent reaches the model endpoint via its own compiled
      # binary (the /usr/bin/opencode node shim spawns this). It must be
      # allowlisted or the agent's model calls are denied by the egress proxy.
      - { path: /usr/lib/node_modules/opencode-ai/bin/.opencode }
      - { path: /usr/bin/node }
  travel_api:
    name: travel-api
    endpoints:
      - host: mock-travel-api
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      # The agent runs `python3 travel_search.py`; in this base image the
      # default `python3` is the project venv, which (unlike /usr/bin/python3)
      # has the `requests` module installed. Allowlist it so the tool's call
      # to the travel API is permitted. The policy engine resolves this
      # symlink to the underlying uv-managed interpreter.
      - { path: /sandbox/.venv/bin/python3 }
