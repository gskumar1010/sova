apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-travel-api
  labels:
    app.kubernetes.io/name: mock-travel-api
    app.kubernetes.io/part-of: openshell-kata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-travel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-travel-api
        app.kubernetes.io/part-of: openshell-kata
    spec:
      containers:
        - name: api
          image: REGISTRY_PLACEHOLDER/openshell-kata-mock-travel-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-travel-api
  labels:
    app.kubernetes.io/name: mock-travel-api
    app.kubernetes.io/part-of: openshell-kata
spec:
  selector:
    app.kubernetes.io/name: mock-travel-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
