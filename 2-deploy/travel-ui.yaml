apiVersion: v1
kind: ServiceAccount
metadata:
  name: travel-ui
  labels:
    app.kubernetes.io/part-of: openshell-kata
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-ui
  labels:
    app.kubernetes.io/name: travel-ui
    app.kubernetes.io/part-of: openshell-kata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travel-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travel-ui
        app.kubernetes.io/part-of: openshell-kata
    spec:
      serviceAccountName: travel-ui
      containers:
        - name: ui
          image: REGISTRY_PLACEHOLDER/openshell-kata-travel-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: SANDBOX_NAME
              value: opencode-dual
            # The openshell CLI (baked into this image) connects directly to the
            # gateway using this endpoint; the gateway then execs into the Kata
            # sandbox. The gateway runs plaintext (disableTls) and allows
            # unauthenticated users, so no client certs are required.
            - name: OPENSHELL_GATEWAY_ENDPOINT
              value: http://openshell-kata:8080
            # Live mode: the UI drives the real sandboxed agent via
            # `openshell sandbox exec ... opencode run`. A prompt-injection
            # exfiltration attempt is blocked by the OpenShell egress policy and
            # surfaced in the UI. Set to "1" for the self-contained fake demo.
            - name: TRAVEL_UI_FAKE
              value: "0"
            # gemma-31b agent turns can take a few minutes; give exec headroom.
            - name: OPENSHELL_EXEC_TIMEOUT
              value: "300"
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: travel-ui
  labels:
    app.kubernetes.io/name: travel-ui
    app.kubernetes.io/part-of: openshell-kata
spec:
  selector:
    app.kubernetes.io/name: travel-ui
  ports:
    - name: http
      port: 8501
      targetPort: 8501
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: travel-ui
  labels:
    app.kubernetes.io/name: travel-ui
    app.kubernetes.io/part-of: openshell-kata
spec:
  to:
    kind: Service
    name: travel-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
